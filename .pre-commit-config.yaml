repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: "v6.0.0"
    hooks:
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-json
        exclude: ^.devcontainer/devcontainer.json
      - id: pretty-format-json
        exclude: ^(?:\.devcontainer/devcontainer\.json|evaluation/memory/atomic_extraction/cases/atomic-extraction-v1\.json|evaluation/memory/locomo/dataset/locomo10\.json)$
        args: [--autofix, --no-sort-keys, --no-ensure-ascii]
      - id: end-of-file-fixer
        exclude: ^evaluation/memory/locomo/dataset/locomo10\.json$
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.15.7"
    hooks:
      # 参赛作品目录是独立交付物,不参与上游核心代码的 lint:
      # 上游规则(如 RUF002 全角括号)对中文演示代码不适用。
      - id: ruff-check
        exclude: ^(?:dify|minimax|gaode|stepfun|qoder|notes)/
        args: [--exit-non-zero-on-fix]
      - id: ruff-format
        exclude: ^(?:dify|minimax|gaode|stepfun|qoder|notes)/

  - repo: local
    hooks:
      - id: ty-check
        name: ty check
        entry: uv run --locked ty check
        language: system
        pass_filenames: false
        always_run: true
